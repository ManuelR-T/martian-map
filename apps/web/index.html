<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#131f38" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Marps</title>
    <script>
      // Applique le thème avant le premier rendu : choix enregistré, sinon préférence du système.
      (function () {
        var theme = null;
        try {
          theme = window.localStorage.getItem('marps-theme');
        } catch (error) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

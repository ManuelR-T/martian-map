[project]
name = "marps-data"
version = "0.0.0"
description = "Download, freeze and validate the Marps MVP data extracts."
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.4",
  "pillow==13.0.0",
  "pyogrio==0.11.1",
  "shapely==2.1.2",
  "tifffile==2026.11.12",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
